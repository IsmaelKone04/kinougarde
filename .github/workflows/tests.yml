name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: kinougarde_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Installer les dépendances Composer
        run: composer install --no-progress --prefer-dist

      - name: Charger le schéma dans la base de test
        run: mysql -h 127.0.0.1 -u root kinougarde_test < sql/schema.sql

      - name: Lancer les tests
        run: composer test
